# Builds against the published agent contract;
name: Build

# Documentation-only pushes build nothing;
on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: ['**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and unit tests
    # Pinned to the oldest glibc it must run against, because a native image links it dynamically.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      # -s settings.xml declares the snapshot repository, and keeps a developer's own out.
      - name: Build and unit tests
        run: ./mvnw -B -s settings.xml verify

      # A bump that forgets the digest builds and packages green, and fails at an image build.
      # Sokar's release tool and the machine tooling, resolved once for every step that calls them.
      - name: Resolve the release and machine tooling
        run: |
          ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
              -Dmdep.outputFile=target/cp.txt

      - name: The pin agrees everywhere it is written
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main check-pin

      # The packages are what an operator installs;
      # Not -DskipTests: that also skips NativeLinkageCheck, the one test that needs the binary.
      - name: Native binary and packages
        run: ./mvnw -B -s settings.xml -Pnative,dist verify
             -Dagent.snapshot.run=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            target/*.deb
            target/*.rpm
          if-no-files-found: error

      # Only main publishes, and a run that publishes nothing says so rather than skipping silently.
      - name: Not publishing
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        run: |
          echo "Not publishing. This run is '${{ github.event_name }}' on '${{ github.ref }}',"
          echo "and only a push to main publishes. The packages were built and tested here"
          echo "and are attached to this run as artifacts; nothing reached Artifactory, so"
          echo "'apt' will still offer whatever was published last."

      # Off: build-info goes to a repository this token cannot write, warning on every run.
      - uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # Sokar's own repositories, because this package depends on sokar; deb.* is what indexes it.
      - name: Publish the packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -eux
          # --flat, or the source directory travels and the package lands beside nothing.
          jf rt upload "target/*.deb" "sokar-dist-deb/pool/main/s/sokar-agent-omp/" \
              --flat=true \
              --target-props="deb.distribution=snapshots;deb.component=main;deb.architecture=amd64"
          jf rt upload "target/*.rpm" "sokar-dist-rpm/snapshots/" --flat=true

          # The bill beside the package, readable without installing.
          jf rt upload "target/sokar-agent-omp.cdx.json" "sokar-dist-deb/pool/main/s/sokar-agent-omp/" --flat=true
          jf rt upload "target/sokar-agent-omp.cdx.json" "sokar-dist-rpm/snapshots/" --flat=true

      # Uploaded is not installable: indexing is asynchronous, and silent when it fails.
      - name: The package is indexed, not merely stored
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -eu
          tries=0
          # -L: Artifactory answers a file with a redirect to its cloud storage, and without it the
          # body is empty - every package then reads as "not indexed" although it is.
          while [ "$tries" -lt 20 ]; do
              if jf rt curl -sL -XGET \
                  "/sokar-dist-deb/dists/snapshots/main/binary-amd64/Packages" 2>/dev/null \
                  | grep -q "Package: sokar-agent-omp"; then
                  echo "  OK    the Debian index lists sokar-agent-omp"
                  exit 0
              fi
              tries=$((tries + 1))
              sleep 6
          done
          echo "::error::sokar-agent-omp never appeared in the index - uploaded but not indexed"
          exit 1

  acceptance:
    name: Acceptance - ${{ matrix.os }}
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    strategy:
      fail-fast: false
      # One at a time: four repositories share one Hetzner project and nothing coordinates them.
      max-parallel: 1
      matrix:
        os: [ubuntu, fedora]

    steps:
      - uses: actions/checkout@v7

      # For the Cucumber half, which runs here against the rented machine.
      - name: Set up Java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      # Before anything is created, so the cleanup below always has something to run.
      - name: Resolve the machine tooling
        run: |
          # As fresh as the repository is; what it cannot fix is a build that has not published yet.
          ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
              -Dmdep.outputFile=target/cp.txt

      # SOKAR_E2E_OPENROUTER_API_KEY turns tier 2 on;
      - name: Acceptance on ${{ matrix.os }}
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
          SOKAR_CI_LEG: acc-${{ matrix.os }}
          SOKAR_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          # Here rather than a repository setting, so the model is visible and changes with a commit.
          SOKAR_E2E_MODEL: z-ai/glm-4.6
        # '--cucumber' runs the suite from here as a person at a terminal;
        run: |
          java -cp "$(cat target/cp.txt)" org.fuin.sokar.machines.Main acceptance \
              --os ${{ matrix.os }} --package sokar-agent-omp \
              --cucumber .

      - name: Delete what this run created
        if: always()
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          SOKAR_CI_LEG: acc-${{ matrix.os }}
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.machines.Main sweep --mine
